<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b10;--panel:#14141c;--panel2:#1c1c27;--line:#2a2a38;--txt:#ececf3;--mut:#9696a8;--acc:#ff2d55;--acc2:#ffcc00;--ok:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Inter,system-ui,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 16px 80px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#ff7a00);display:grid;place-items:center;font-weight:800;font-size:20px}
  h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.02em}
  header p{margin:0;color:var(--mut);font-size:13px}
  .badge{margin-left:auto;font-size:12px;padding:5px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
  .badge.on{color:var(--ok);border-color:#1f5d36}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
  .hero{display:flex;gap:10px;flex-wrap:wrap}
  .hero input[type=url]{flex:1 1 380px;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:15px 16px;font-size:16px}
  .hero input:focus{outline:2px solid var(--acc);border-color:transparent}
  button.go{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:0 26px;font-weight:700;font-size:16px;cursor:pointer;min-height:52px}
  button.go:disabled{opacity:.5;cursor:wait}
  .or{color:var(--mut);font-size:13px;margin:12px 0 0}
  .or label{color:var(--txt);text-decoration:underline;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:20px}
  .f label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:500}
  .f select,.f input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:inherit}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;padding-top:22px}
  .chk input{width:18px;height:18px;accent-color:var(--acc)}
  .styles{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
  .st{cursor:pointer;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#000;font-weight:800;font-family:'Arial Black',Inter,sans-serif;letter-spacing:.02em;font-size:14px;text-shadow:0 0 3px #000,2px 2px 0 #000}
  .st.sel{border-color:var(--acc)}
  .st b{color:var(--hl)}
  #prog{display:none;margin-top:22px}
  .bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff7a00);transition:width .4s}
  .msg{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-top:8px;gap:12px}
  .err{color:#ff6b6b;white-space:pre-wrap}
  #out{margin-top:28px}
  #out h2{font-size:18px;margin:0 0 14px}
  .clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .clip{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .clip video{width:100%;aspect-ratio:9/16;background:#000;display:block;object-fit:contain}
  .clip .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .row{display:flex;align-items:center;gap:8px}
  .score{font-weight:800;font-size:13px;padding:3px 8px;border-radius:8px;background:#2b1a00;color:var(--acc2)}
  .dur{color:var(--mut);font-size:12px}
  .clip h3{margin:0;font-size:15px;line-height:1.3}
  .why{color:var(--mut);font-size:12.5px}
  .cap{font-size:12.5px;background:var(--panel2);border-radius:8px;padding:8px;color:#cfcfe0;max-height:90px;overflow:auto}
  .rv{font-size:12.5px;border-radius:10px;padding:9px 10px;border:1px solid var(--line);background:var(--panel2)}
  .rv.ok{border-color:#1f5d36}.rv.no{border-color:#7a2a2a}
  .rv .t{font-weight:700;margin-bottom:3px}.rv.ok .t{color:var(--ok)}.rv.no .t{color:#ff8a8a}
  .rv ul{margin:6px 0 0;padding-left:18px;color:#cfcfe0}.rv li{margin:2px 0}
  .rv .g-alta{color:#ff8a8a;font-weight:700}.rv .g-media{color:var(--acc2);font-weight:700}.rv .g-baja{color:var(--mut);font-weight:700}
  .acts{display:flex;gap:8px;margin-top:auto}
  .acts a,.acts button{flex:1;text-align:center;border-radius:10px;padding:9px;font-weight:600;font-size:13px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt)}
  .acts a.dl{background:var(--acc);border-color:var(--acc);color:#fff}
  @media (max-width:560px){.wrap{padding:18px 16px 60px}button.go{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">✂</div>
    <div><h1>ClipForge</h1><p>De video largo a clips virales para TikTok, Shorts y Reels</p></div>
    <span class="badge" id="aiBadge">IA: …</span>
  </header>

  <form class="card" id="form">
    <div class="hero">
      <input type="url" name="url" id="url" placeholder="Pega el link de YouTube… https://youtube.com/watch?v=">
      <button class="go" id="go" type="submit">Generar clips</button>
    </div>
    <p class="or">o <label for="file">sube un video desde tu equipo</label> <span id="fname"></span>
      <input type="file" id="file" name="file" accept="video/*" hidden></p>

    <div class="styles" id="styles"></div>
    <input type="hidden" name="caption_style" id="caption_style" value="viral">

    <div class="grid">
      <div class="f"><label>Número de clips</label><input type="number" name="num_clips" value="5" min="1" max="30"></div>
      <div class="f"><label>Duración mínima (s)</label><input type="number" name="min_len" value="20" min="5" max="170"></div>
      <div class="f"><label>Duración máxima (s)</label><input type="number" name="max_len" value="60" min="10" max="180"></div>
      <div class="f"><label>Formato</label><select name="aspect">
        <option value="9:16">9:16 · TikTok / Shorts / Reels</option><option value="4:5">4:5 · Feed Instagram</option>
        <option value="1:1">1:1 · Cuadrado</option><option value="16:9">16:9 · Horizontal</option></select></div>
      <div class="f"><label>Encuadre</label><select name="layout">
        <option value="auto">Automático</option><option value="track">Seguir la cara</option>
        <option value="blur">Video completo + fondo desenfocado</option>
        <option value="gaming">Stream: webcam arriba + juego abajo</option>
        <option value="gamecenter">Solo el juego (sin webcam)</option></select></div>
      <div class="f"><label>Palabras por línea</label><select name="words_per_line">
        <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
      <div class="f"><label>Idioma</label><select name="language">
        <option value="">Detectar</option><option value="es">Español</option><option value="en">Inglés</option>
        <option value="pt">Portugués</option><option value="fr">Francés</option></select></div>
      <div class="f"><label>Precisión transcripción</label><select name="whisper_model">
        <option value="base">Rápida</option><option value="small" selected>Equilibrada</option>
        <option value="medium">Alta</option><option value="large-v3">Máxima (lenta)</option></select></div>
      <div class="f"><label>Fuente</label><input name="font" value="Arial Black"></div>
      <div class="f"><label>Calidad (CRF)</label><select name="crf">
        <option value="16">Máxima</option><option value="18" selected>Alta</option><option value="21">Media</option></select></div>
      <label class="chk"><input type="checkbox" id="hook" checked> Titular gancho arriba</label>
      <label class="chk"><input type="checkbox" id="ai" checked> Elegir clips con IA</label>
      <label class="chk"><input type="checkbox" id="review" checked> Revisar clips con IA</label>
    </div>

    <div id="prog">
      <div class="bar"><i id="barI"></i></div>
      <div class="msg"><span id="pmsg">Iniciando…</span><span id="ppct">0%</span></div>
    </div>
  </form>

  <section id="out"></section>
</div>

<script>
const STY = {viral:["#FFE600","QUE <b>LOCURA</b> ESTO"],caja:["#00E676","QUE <b>LOCURA</b> ESTO"],karaoke:["#FF3DD8","QUE <b>LOCURA</b> ESTO"],
  neon:["#00F0FF","QUE <b>LOCURA</b> ESTO"],minimal:["#FFFFFF","Que locura esto"],none:["#888","Sin subtítulos"]};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch("/api/config").then(r=>r.json()).then(c=>{
  const b=$("#aiBadge"); b.textContent = c.ai ? "IA: Claude activa" : "IA: algoritmo local"; if(c.ai) b.classList.add("on");
}).catch(()=>{});

const box=$("#styles");
for (const [k,[c,t]] of Object.entries(STY)) {
  const d=document.createElement("div"); d.className="st"+(k==="viral"?" sel":""); d.style.setProperty("--hl",c);
  if(k==="caja"){d.style.background="#000";d.style.boxShadow="inset 0 0 0 40px #000";}
  d.innerHTML=t; d.title=k; d.onclick=()=>{document.querySelectorAll(".st").forEach(x=>x.classList.remove("sel"));d.classList.add("sel");$("#caption_style").value=k;};
  box.appendChild(d);
}
$("#file").onchange=e=>{$("#fname").textContent=e.target.files[0]?.name||""; if(e.target.files[0]) $("#url").value="";};

$("#form").onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData($("#form"));
  if (!fd.get("url") && !$("#file").files[0]) { $("#url").focus(); return; }
  if (!$("#file").files[0]) fd.delete("file");
  fd.set("show_hook", $("#hook").checked); fd.set("use_ai", $("#ai").checked); fd.set("review", $("#review").checked);
  $("#go").disabled = true; $("#prog").style.display="block"; $("#out").innerHTML="";
  setP(0,"Enviando…");
  try {
    const r = await fetch("/api/jobs",{method:"POST",body:fd});
    const j = await r.json(); if(!r.ok) throw new Error(j.detail||"Error");
    poll(j.id);
  } catch(err){ fail(err.message); }
};
function setP(p,m){$("#barI").style.width=p+"%";$("#ppct").textContent=Math.round(p)+"%";$("#pmsg").textContent=m;}
function fail(m){$("#pmsg").innerHTML='<span class="err">'+esc(m)+'</span>';$("#go").disabled=false;}
async function poll(id){
  const j = await (await fetch("/api/jobs/"+id)).json();
  setP(j.progress, j.message);
  if (j.status==="done") { $("#go").disabled=false; show(id,j.result); return; }
  if (j.status==="error") { fail(j.message); return; }
  setTimeout(()=>poll(id), 1200);
}
function show(id,res){
  const cs = res.clips;
  $("#out").innerHTML = `<h2>${cs.length} clips · ${esc(res.title)}</h2><div class="clips">${cs.map(c=>{
    const cap = (c.caption||c.title)+"\n\n"+(c.hashtags||[]).join(" ");
    const u = `/files/${id}/${encodeURIComponent(c.file)}`;
    return `<div class="clip">
      <video src="${u}" ${c.thumb?`poster="/files/${id}/${encodeURIComponent(c.thumb)}"`:""} controls preload="metadata" playsinline></video>
      <div class="b">
        <div class="row"><span class="score">🔥 ${Math.round(c.score)}</span><span class="dur">${c.duration.toFixed(0)}s · ${fmt(c.start)}–${fmt(c.end)}</span></div>
        <h3>${esc(c.title)}</h3>
        <div class="why">${esc(c.reason)}</div>
        ${review(c.review)}
        <div class="cap">${esc(cap).replace(/\n/g,"<br>")}</div>
        <div class="acts"><a class="dl" href="${u}?download=1">Descargar</a><button data-cap="${esc(cap)}" onclick="navigator.clipboard.writeText(this.dataset.cap);this.textContent='¡Copiado!'">Copiar texto</button></div>
      </div></div>`;}).join("")}</div>`;
}
function review(r){
  if(!r || !Object.keys(r).length) return "";
  if(r.error) return `<div class="rv"><div class="t">Revisión IA no disponible</div>${esc(r.error)}</div>`;
  const items = [
    ...(r.problemas||[]).map(p=>`<li><span class="g-${esc(p.gravedad)}">${esc(p.gravedad)}</span> · ${esc(p.tipo)}${p.segundo!=null?` (s${Math.round(p.segundo)})`:""}: ${esc(p.detalle)}</li>`),
    ...(r.sugerencias||[]).map(s=>`<li>💡 ${esc(s)}</li>`)];
  return `<div class="rv ${r.aprobado?"ok":"no"}"><div class="t">${r.aprobado?"✅ Listo para publicar":"⚠️ Revisar antes de publicar"} · ${r.nota}/100</div>
    ${esc(r.resumen)}${items.length?`<ul>${items.join("")}</ul>`:""}</div>`;
}
const fmt = s => { s=Math.floor(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
</script>
</body>
</html>
